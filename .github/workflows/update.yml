name: Update and deploy

on:
  schedule:
    # Weekdays (UTC 06–14 = Taipei 14–22, same calendar day). Off the :00 mark,
    # because GitHub delays/drops top-of-hour schedules most. Extra runs are cheap:
    # a gate step exits in seconds once today's final data is already published.
    - cron: "7,27,47 6-13 * * 1-5"   # 台北 14:07, 14:27, 14:47 … 21:47（每 20 分）
    - cron: "17 7-12 * * 1-5"        # 台北 15:17 … 20:17（備援，錯開時間）
    - cron: "37 14 * * 1-5"          # 台北 22:37（最後補一次）
    # US indices (標普500 / 納指 / 費半): US close 16:00 ET = 台北 05:00 (EST) / 04:00 (EDT).
    - cron: "37 21-23 * * 1-5"       # 台北 週二–週六 05:37, 06:37, 07:37
    - cron: "7 22,23 * * 1-5"        # 台北 週二–週六 06:07, 07:07（備援）
    - cron: "37 0 * * 2-6"           # 台北 週二–週六 08:37（最後補一次）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate (skip if today's data is already final)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/should_run.py
          else
            echo "run=${{ github.event_name != 'push' }}" >> "$GITHUB_OUTPUT"
            echo "run_us=${{ github.event_name != 'push' }}" >> "$GITHUB_OUTPUT"
            echo "gate: ${{ github.event_name }} event"
          fi

      - name: Restore market data cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: mkt-${{ github.run_id }}
          restore-keys: mkt-

      - name: Compute levels
        id: compute
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 18
        run: python3 scripts/compute_all.py --out data/latest.json

      - name: Restore picks cache (daily bars)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache_picks
          key: picks-${{ github.run_id }}
          restore-keys: picks-

      # 選股回查：第一根大陽線掃描（純 Python，約 1–2 分鐘）。失敗不影響點位網站。
      - name: Picks scan (first big bullish candle)
        id: picks
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 12
        continue-on-error: true
        run: python3 scripts/picks_scan.py

      # Kronos 只在有新訊號需要預測時才安裝與執行；失敗不影響其他步驟。
      - name: Set up Python for Kronos
        id: pysetup
        if: steps.picks.outputs.need_kronos == 'true'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/picks_requirements.txt

      - name: Cache Hugging Face model
        if: steps.pysetup.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-mini-v1

      - name: Kronos mini on CPU (non-fatal)
        id: kronos
        if: steps.pysetup.outcome == 'success'
        timeout-minutes: 15
        continue-on-error: true
        env:
          KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          KRONOS_DIR: ${{ github.workspace }}/kronos_src
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/picks_requirements.txt
          mkdir -p "$KRONOS_DIR" && cd "$KRONOS_DIR"
          git init -q . && git remote add origin https://github.com/shiyu-coder/Kronos.git
          git fetch -q --depth 1 origin "$KRONOS_COMMIT" && git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          python scripts/picks_kronos_apply.py

      - name: Save picks cache
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache_picks
          key: picks-${{ hashFiles('cache_picks/days/*') }}
        continue-on-error: true

      - name: Compute US indices (標普500 / 納指 / 費半)
        if: steps.gate.outputs.run_us == 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: python3 scripts/compute_us.py

      - name: Save market data cache
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: mkt-${{ hashFiles('cache/twse/*', 'cache/tpex/*', 'cache/txtick/*') }}
        continue-on-error: true

      - name: Commit data if changed
        id: commit
        if: steps.gate.outputs.run == 'true' || steps.gate.outputs.run_us == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/days data/us.json data/us_hist data/picks
          if git diff --staged --quiet; then
            echo "No data change (holiday, late publish, or already up to date)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            DATE=$(python3 -c "import json; print(json.load(open('data/latest.json'))['date'])")
            US=$(python3 -c "import json; print(json.load(open('data/us.json'))['date'])" 2>/dev/null || echo -)
            git commit -m "chore: update levels for ${DATE} (US ${US})"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage site
        id: stage
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p _site/data
          cp index.html picks.html _site/
          mkdir -p _site/data/picks
          cp data/picks/*.json _site/data/picks/
          cp data/latest.json _site/data/
          python3 scripts/build_hist.py _site/data/hist
          if [ -f data/us.json ]; then cp data/us.json _site/data/; cp data/us_hist/*.json _site/data/hist/; fi
          du -sh _site/data/hist
          touch _site/.nojekyll

      - name: Configure Pages
        if: steps.stage.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.stage.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.stage.outcome == 'success'
        uses: actions/deploy-pages@v4
